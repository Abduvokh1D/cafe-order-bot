name: cafe-order-bot

services:
  postgres:
    image: postgres:17-alpine
    container_name: cafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylida POSTGRES_PASSWORD yozilmagan}
    ports:
      # Faqat shu kompyuterdan ulanish mumkin, tarmoqqa ochilmaydi
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
